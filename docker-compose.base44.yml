services:
  web:
    image: ruby:2.6
    working_dir: /app
    volumes:
      - .:/app
      - bundle_cache:/bundle
    environment:
      - BUNDLE_PATH=/bundle
    command:
      - sh
      - -c
      - bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 3000 --config _config.yml,_config.base44.yml --force_polling
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 300s

volumes:
  bundle_cache:
